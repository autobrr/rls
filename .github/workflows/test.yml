name: test

on:
  push:
    branches:
      - "master"
    tags:
      - 'v*'
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/images/**'
      - 'Makefile'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/images/**'
      - 'Makefile'
      - '**.md'

jobs:
  test:
    name: Test ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "not gofmt'd:"; echo "$out"; exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Vet (cli)
        working-directory: cmd/rls
        run: go vet ./...

      - name: Test (cli)
        working-directory: cmd/rls
        run: go test -race ./...

      - name: Fuzz (smoke)
        run: go test -run XXX -fuzz FuzzParseString -fuzztime 60s .